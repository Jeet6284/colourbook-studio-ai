# Deploy on Render (https://render.com): New + > Blueprint > select this repo.
services:
  - type: web
    name: colourbook-studio-ai
    runtime: docker
    plan: starter            # a persistent disk requires a paid instance
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: IMAGE_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false          # paste in the Render dashboard
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
