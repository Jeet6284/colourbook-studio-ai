name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q *.zip
          rm *.zip
          rm -rf app/.github
          shopt -s dotglob
          cp -r app/* .
          rm -rf app
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add ColourBook Studio AI"
          git push
